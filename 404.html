<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <meta name="robots" content="noindex">
  <!-- Clean URLs on GitHub Pages: /about, /projects, /contact ... are not real files, so GitHub serves this page.
       It sends the visitor to the home page, which restores the clean address and scrolls to the section.
       (Technique from github.com/rafgraph/spa-github-pages.) -->
  <script>
    var routes = ['about', 'skills', 'experience', 'projects', 'education', 'cv', 'contact'];
    var l = window.location;
    var first = l.pathname.split('/').filter(Boolean)[0] || '';
    /* user site / custom domain: keep 0 folders; project site (user.github.io/repo/): keep the repo folder */
    var keep = (routes.indexOf(first) > -1 || !first || first.indexOf('.') > -1) ? 0 : 1;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + keep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(keep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <noscript><p>Page not found. <a href="./">Go to the portfolio home page</a>.</p></noscript>
</body>
</html>
